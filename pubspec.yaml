name: apk_paud
description: WebView untuk SWF.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.11.0
  webview_flutter_android: ^4.5.0
  file_picker: ^8.1.6
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: icon_protika.png
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: icon_protika.png

flutter:
  uses-material-design: true
